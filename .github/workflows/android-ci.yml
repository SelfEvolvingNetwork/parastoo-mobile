name: android-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: parastoo-mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # انتشار خودکار: هر push سبز به main یک رلیز گیت‌هاب با تگ متحرک
  # mobile-r<run_number> می‌سازد؛ ورکر پنل پرستو همین را به بخش دانلودهای
  # سایت می‌آورد (قرارداد کامل: README «کانال انتشار خودکار»).
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: parastoo-mobile-debug-apk
          path: apk

      - name: Publish release (tag mobile-r<run_number>)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mobile-r${{ github.run_number }}"
          mv apk/app-debug.apk parastoo-mobile-debug.apk
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Parastoo Mobile - build $TAG" \
            --notes "Automated CI build of commit ${GITHUB_SHA:0:7}. Install: download the APK and sideload it. The Parastoo panel Downloads page always serves the latest verified build." \
            "parastoo-mobile-debug.apk#parastoo-mobile-debug.apk"
