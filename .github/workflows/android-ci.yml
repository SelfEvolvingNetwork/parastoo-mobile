name: android-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # امضای پایدار: keystore از Secrets گیت‌هاب بازخوانی می‌شود تا همهٔ
      # بیلدها یک امضا داشته باشند و هر نسخه مستقیم روی قبلی نصب شود
      - name: Restore stable signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Secretهای امضا (ANDROID_KEYSTORE_*) کامل تنظیم نشده‌اند"
            exit 1
          fi
          KS="$RUNNER_TEMP/parastoo-mobile.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
          {
            echo "CI_KEYSTORE_FILE=$KS"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: parastoo-mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # انتشار خودکار: هر push سبز به main یک رلیز گیت‌هاب با تگ متحرک
  # mobile-r<run_number> می‌سازد؛ ورکر پنل پرستو همین را به بخش دانلودهای
  # سایت می‌آورد (قرارداد کامل: README «کانال انتشار خودکار»).
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # برای خواندن versionName/versionCode از app/build.gradle.kts (ساخت مانیفست)
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: parastoo-mobile-debug-apk
          path: apk

      - name: Publish release (tag mobile-r<run_number>)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mobile-r${{ github.run_number }}"
          mv apk/app-debug.apk parastoo-mobile-debug.apk
          # صحت دو-کاناله برای آپدیت‌کنندهٔ خودکار خود اپ (الگوی پل):
          # کانال اول = sha256 کنار دارایی رلیز؛ کانال دوم = RELEASE_MANIFEST.json
          # روی main (گام بعد). مانیفست versionCode دارد — گارد downgrade اپ.
          sha256sum parastoo-mobile-debug.apk | awk '{print $1}' > parastoo-mobile-debug.apk.sha256
          VN=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          VC=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | head -1 | awk '{print $3}')
          python3 -c "import json,sys,time; vn,vc=sys.argv[1],int(sys.argv[2]); sha=open('parastoo-mobile-debug.apk.sha256').read().strip(); json.dump({'versionName':vn,'versionCode':vc,'filename':'parastoo-mobile-debug.apk','sha256':sha,'created_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}, open('manifest.json','w'), indent=2)" "$VN" "$VC"
          cat manifest.json
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Parastoo Mobile - build $TAG" \
            --notes "Automated CI build of commit ${GITHUB_SHA:0:7}. Install: download the APK and sideload it — or use the in-app self-updater (card «به‌روزرسانی خودکار اپ»). The Parastoo panel Downloads page always serves the latest verified build." \
            "parastoo-mobile-debug.apk#parastoo-mobile-debug.apk" \
            "parastoo-mobile-debug.apk.sha256#parastoo-mobile-debug.apk.sha256" \
            "manifest.json#manifest.json"

      - name: به‌روزرسانی RELEASE_MANIFEST.json روی main (کانال دوم صحت)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(base64 -w0 manifest.json)
          EXISTING_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/RELEASE_MANIFEST.json" --jq '.sha' 2>/dev/null || true)
          ARGS=(repos/$GITHUB_REPOSITORY/contents/RELEASE_MANIFEST.json \
                -f message="[skip ci] app release manifest mobile-r${{ github.run_number }}" \
                -f content="$CONTENT" -f branch=main)
          [ -n "$EXISTING_SHA" ] && ARGS+=(-f sha="$EXISTING_SHA")
          gh api -X PUT "${ARGS[@]}" --jq '.commit.sha'
