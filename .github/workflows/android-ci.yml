name: android-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # امضای پایدار: keystore از Secrets گیت‌هاب بازخوانی می‌شود تا همهٔ
      # بیلدها یک امضا داشته باشند و هر نسخه مستقیم روی قبلی نصب شود
      - name: Restore stable signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Secretهای امضا (ANDROID_KEYSTORE_*) کامل تنظیم نشده‌اند"
            exit 1
          fi
          KS="$RUNNER_TEMP/parastoo-mobile.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
          {
            echo "CI_KEYSTORE_FILE=$KS"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # پیش‌پرواز مرجع‌یابی صلیبی سه ماژول (درس ران ۲۶) — پیش از هر بیلد
      - name: Preflight cross-module refs
        run: python3 scripts/preflight_refs.py

      # ۱) هسته: AAR ماژول :coreimpl (کامپوننت‌های SDK همین‌جا نصب می‌شوند)
      - name: Build core module (AAR)
        run: gradle :coreimpl:assembleDebug --no-daemon

      # ۲) بستهٔ هسته: classes.jar → d8 → classes.dex + مانیفست + zip
      #    و جاسازی در assets بدنه (خط پایین اطمینان rollback لودر)
      - name: Pack core bundle (dex + manifest)
        run: bash scripts/pack_core.sh coreimpl/build/outputs/aar/coreimpl-debug.aar "$GITHUB_RUN_NUMBER"

      # ۳) بدنه: APK با بستهٔ هستهٔ جاسازی‌شده
      - name: Build debug APK (body)
        run: gradle :app:assembleDebug --no-daemon

      # ۴) گیت کامل‌بودن بدنه (درس rev31 — فاجعهٔ گوشی مالک): هر مرجع کلاسِ
      #    dex هسته باید در dexهای APK بدنه تعریف شده باشد؛ وگرنه هسته روی
      #    گوشی لود/رندر نمی‌شود و rollback هم چیزی برای فالبک ندارد
      - name: Preflight core-to-body dex completeness
        run: python3 scripts/dex_forensics.py core/build/pack-work/classes.dex app/build/outputs/apk/debug/app-debug.apk --gate

      - name: Upload artifacts (APK + core bundle)
        uses: actions/upload-artifact@v4
        with:
          name: parastoo-mobile-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            core/build/parastoo-core.zip
            core/build/parastoo-core.zip.sha256

  # انتشار خودکار: هر push سبز به main یک رلیز گیت‌هاب با تگ متحرک
  # mobile-r<run_number> می‌سازد؛ ورکر پنل پرستو همین را به بخش دانلودهای
  # سایت می‌آورد (قرارداد کامل: README «کانال انتشار خودکار»).
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # برای خواندن versionName/versionCode از app/build.gradle.kts (ساخت مانیفست)
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: parastoo-mobile-debug-apk
          path: apk

      - name: Publish release (tag mobile-r<run_number>)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mobile-r${{ github.run_number }}"
          # artifact چند-فایلی است و مسیرها نسبت به جد مشترک حفظ می‌شوند —
          # یافتن مقاوم به ساختار:
          mv "$(find apk -name 'app-debug.apk')" parastoo-mobile-debug.apk
          mv "$(find apk -name 'parastoo-core.zip')" parastoo-core.zip
          mv "$(find apk -name 'parastoo-core.zip.sha256')" parastoo-core.zip.sha256
          # صحت دو-کاناله برای آپدیت‌کننده‌های خودکار (الگوی پل):
          # کانال اول = sha256 کنار دارایی رلیز؛ کانال دوم = RELEASE_MANIFEST.json
          # روی main (گام بعد). مانیفست versionCode و بخش core دارد —
          # گارد downgrade اپ و هسته.
          sha256sum parastoo-mobile-debug.apk | awk '{print $1}' > parastoo-mobile-debug.apk.sha256
          VN=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          VC=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | head -1 | awk '{print $3}')
          CORE_SHA=$(cat parastoo-core.zip.sha256)
          python3 -c "import json,sys,time; vn,vc,core_sha,run=sys.argv[1],int(sys.argv[2]),sys.argv[3],int(sys.argv[4]); sha=open('parastoo-mobile-debug.apk.sha256').read().strip(); json.dump({'versionName':vn,'versionCode':vc,'filename':'parastoo-mobile-debug.apk','sha256':sha,'created_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'core':{'schema':'parastoo-core/1','revision':run,'version_code':vc,'version_name':vn,'min_body_version_code':vc,'filename':'parastoo-core.zip','sha256':core_sha}}, open('manifest.json','w'), indent=2)" "$VN" "$VC" "$CORE_SHA" "${{ github.run_number }}"
          cat manifest.json
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Parastoo Mobile - build $TAG" \
            --notes "Automated CI build of commit ${GITHUB_SHA:0:7}. Architecture: fixed body APK (install once) + hot core (parastoo-core.zip) that the body updates silently over the air — no reinstall for core releases. The Parastoo panel Downloads page always serves the latest verified build." \
            "parastoo-mobile-debug.apk#parastoo-mobile-debug.apk" \
            "parastoo-mobile-debug.apk.sha256#parastoo-mobile-debug.apk.sha256" \
            "parastoo-core.zip#parastoo-core.zip" \
            "parastoo-core.zip.sha256#parastoo-core.zip.sha256" \
            "manifest.json#manifest.json"

      - name: به‌روزرسانی RELEASE_MANIFEST.json روی main (کانال دوم صحت)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(base64 -w0 manifest.json)
          EXISTING_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/RELEASE_MANIFEST.json" --jq '.sha' 2>/dev/null || true)
          ARGS=(repos/$GITHUB_REPOSITORY/contents/RELEASE_MANIFEST.json \
                -f message="[skip ci] app release manifest mobile-r${{ github.run_number }}" \
                -f content="$CONTENT" -f branch=main)
          [ -n "$EXISTING_SHA" ] && ARGS+=(-f sha="$EXISTING_SHA")
          gh api -X PUT "${ARGS[@]}" --jq '.commit.sha'
